name: CI

# Runs on pull requests only: merges are squashes of a pull request that
# already passed, so a second run on main would only spend minutes (the repo
# is private, on GitHub's monthly allowance). Run it by hand on main with
# "Run workflow" when wanted.
on:
  pull_request:
  workflow_dispatch:

# A new push to the same pull request cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy vaticore

      - name: Test
        run: uv run pytest
