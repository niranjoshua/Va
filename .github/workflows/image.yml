name: Image

# Build the production image and check it starts, migrates, refuses requests
# without a key, and carries the backup tools. Only when something that goes
# into the image changed, to keep within the private repo's Actions minutes.
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - pyproject.toml
      - uv.lock
      - vaticore/**
      - examples/sites/**
      - .github/workflows/image.yml
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t vaticore:ci .

      - name: Smoke test
        run: |
          docker run -d --name api -p 8000:8000 -e VATICORE_ENVIRONMENT=staging vaticore:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 2; done
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/ready)" = 503
          docker exec api uv run python -m vaticore.pipeline migrate
          curl -sf localhost:8000/ready
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/sites/op/s1/scorecard)" = 401
          docker exec api pg_dump --version
          test "$(docker exec api whoami)" = vaticore
