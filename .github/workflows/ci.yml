name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI only reads the code. Pull requests from forks get no
# secrets and cannot write to the repository.
permissions:
  contents: read

# A new push to the same pull request cancels the run it replaces; runs on
# main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy vaticore

      - name: Test
        run: uv run pytest

  # Build the production image and check it starts, migrates, refuses
  # requests without a key, and carries the backup tools.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build -t vaticore:ci .

      - name: Smoke test
        run: |
          docker run -d --name api -p 8000:8000 -e VATICORE_ENVIRONMENT=staging vaticore:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 2; done
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/ready)" = 503
          docker exec api uv run python -m vaticore.pipeline migrate
          curl -sf localhost:8000/ready
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/sites/op/s1/scorecard)" = 401
          docker exec api pg_dump --version
          test "$(docker exec api whoami)" = vaticore
