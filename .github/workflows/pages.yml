name: Deploy landing page

# Publishes docs/landing to GitHub Pages. The Configure Pages step self-enables
# Pages (enablement: true), so the deploy does not depend on manually setting
# Settings -> Pages -> Source to GitHub Actions first.

on:
  push:
    branches: [main]
    paths:
      - "docs/landing/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes supersede in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload landing page
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/landing

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
